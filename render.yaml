services:
  - type: web
    name: stock-search
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: cd web && python server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "10000"
